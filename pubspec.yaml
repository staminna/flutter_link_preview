version: 2.0.1
homepage: https://github.com/yungzhu/flutter_link_preview
repository: https://github.com/yungzhu/flutter_link_preview
topics:
  - link-preview
  - url-preview
  - opengraph
  - widgets

environment:
  sdk: ^3.4.0
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  html: ^0.15.4
  charset: ^2.0.1
  collection: ^1.18.0
  meta: ^1.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

